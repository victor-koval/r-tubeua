# Тести на кожен пуш — щоб зламане помічали одразу, а не лише перед збіркою
# (build.ps1 теж їх запускає). Windows: програма й тести розраховані на неї.
name: Тести

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
